<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 Exemplo01</title>
    <link rel="stylesheet" href="estilo.css"/>
    <style>
    ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }        
    ul > li{
    border: 1px solid white;
    background-color: lightgreen;
    }

    .desconstructed-pancake {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    .desconstructed-pancake > * {
        flex: 1 1 120px;

    }

    </style>
    </head>
    <body>
        <main>
        <article>
            <ul class="desconstructed-pancake">
                <li>Lorem, ipsum.</li>
                <li>Culpa, accusamus?</li>
                <li>Quos, aliquam!</li>
                <li>Necessitatibus, quam.</li>
            </ul>
    </main>
</body>
</html>
